    <h1>¡Los pulpos tienen tres corazones!</h1>
<p>Los pulpos tienen tres corazones: dos bombean sangre hacia las branquias y uno hacia el resto del cuerpo. ¡Pero eso no es todo! Su sangre es azul porque utiliza una proteína llamada hemocianina, que contiene cobre para transportar el oxígeno.</p>
